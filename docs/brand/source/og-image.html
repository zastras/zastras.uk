<!doctype html>
<!-- Source for site/assets/img/og-image.png. Open in Chrome at a 1200x630 viewport and take a screenshot to regenerate. -->
<html lang="en-GB"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Geist"; src: url("../../../site/assets/fonts/geist-latin-wght.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("../../../site/assets/fonts/geist-mono-latin-wght.woff2") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a1222; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; font-family: "Geist", system-ui, sans-serif; color: #fff; overflow: hidden;
    background:
      radial-gradient(640px 420px at 100% -10%, rgba(61,107,255,.34), transparent 70%),
      radial-gradient(520px 380px at 0% 115%, rgba(61,220,200,.16), transparent 70%),
      #0a1222; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(141,168,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(141,168,255,.08) 1px, transparent 1px);
    background-size: 60px 60px; -webkit-mask-image: radial-gradient(ellipse 90% 80% at 80% 20%, #000 10%, transparent 75%); mask-image: radial-gradient(ellipse 90% 80% at 80% 20%, #000 10%, transparent 75%); }
  .brand { position: relative; display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 64px; height: 64px; }
  .brand b { display: block; font-size: 32px; font-weight: 650; letter-spacing: -.03em; line-height: 1; }
  .brand span { display: block; margin-top: 7px; font-family: "Geist Mono", monospace; font-size: 13px; letter-spacing: .26em; text-transform: uppercase; color: #8da8ff; line-height: 1; }
  .copy { position: absolute; left: 72px; top: 196px; width: 760px; }
  .eyebrow { display: flex; align-items: center; gap: 14px; font-family: "Geist Mono", monospace; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #3ddcc8; }
  .eyebrow::before { content: ""; width: 34px; height: 1px; background: currentColor; }
  h1 { margin-top: 26px; font-size: 92px; line-height: .98; letter-spacing: -.04em; font-weight: 600; }
  h1 em { font-style: normal; background: linear-gradient(95deg, #8da8ff, #3ddcc8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .url { position: absolute; left: 72px; bottom: 56px; font-family: "Geist Mono", monospace; font-size: 18px; letter-spacing: .08em; color: #b7c3d8; }
  .motif { position: absolute; right: -40px; top: 120px; width: 420px; height: 480px; opacity: .95; }
</style></head>
<body><div class="card">
  <div class="grid"></div>
  <div class="brand">
    <svg viewBox="0 0 64 64"><defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D2F52"/><stop offset="1" stop-color="#0A1222"/></linearGradient></defs>
      <rect width="64" height="64" rx="15" fill="url(#t)"/><rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#8DA8FF" stroke-opacity=".28"/>
      <path d="M17 19H47L17 45H47" fill="none" stroke="#DCE6FF" stroke-width="5"/><circle cx="17" cy="19" r="4.8" fill="#8DA8FF"/><circle cx="47" cy="45" r="6" fill="#0A1222" stroke="#3DDCC8" stroke-width="3.2"/></svg>
    <div><b>Zastras</b><span>Practical AI</span></div>
  </div>
  <div class="copy">
    <div class="eyebrow">Practical AI for Edinburgh and the Lothians</div>
    <h1>AI that <em>earns its place</em> in your business.</h1>
  </div>
  <svg class="motif" viewBox="0 0 420 480" fill="none">
    <path d="M230 40V150L330 250V370" stroke="#8da8ff" stroke-opacity=".5" stroke-width="3" stroke-linejoin="round"/>
    <path d="M330 370V470" stroke="#3ddcc8" stroke-opacity=".5" stroke-width="3"/>
    <circle cx="230" cy="40" r="15" fill="#0a1222" stroke="#8da8ff" stroke-width="4"/>
    <circle cx="230" cy="150" r="15" fill="#0a1222" stroke="#8da8ff" stroke-width="4"/>
    <circle cx="330" cy="250" r="24" fill="#0a1222" stroke="#3ddcc8" stroke-width="5"/>
    <circle cx="330" cy="250" r="8" fill="#3ddcc8"/>
    <circle cx="330" cy="250" r="40" stroke="#3ddcc8" stroke-opacity=".3" stroke-width="2"/>
    <circle cx="330" cy="370" r="15" fill="#0a1222" stroke="#8da8ff" stroke-width="4"/>
  </svg>
  <div class="url">zastras.uk</div>
</div></body></html>
