<!doctype html>
<!-- Source for docs/brand/avatar-512.png and site/assets/img/apple-touch-icon.png: the mark, full-bleed, for square or circular crops. -->
<html><head><meta charset="utf-8"><style>
  *{margin:0} html,body{width:512px;height:512px;background:#0a1222}
  svg{display:block;width:512px;height:512px}
</style></head><body>
<svg viewBox="0 0 512 512"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D2F52"/><stop offset="1" stop-color="#0A1222"/></linearGradient></defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- The 64-unit mark glyph, scaled 6.2x and centred: about 50% of the width, safely inside a circular crop. -->
  <g transform="translate(57.6 57.6) scale(6.2)">
    <path d="M17 19H47L17 45H47" fill="none" stroke="#DCE6FF" stroke-width="5"/>
    <circle cx="17" cy="19" r="4.8" fill="#8DA8FF"/>
    <circle cx="47" cy="45" r="6" fill="#0A1222" stroke="#3DDCC8" stroke-width="3.2"/>
  </g>
</svg></body></html>
