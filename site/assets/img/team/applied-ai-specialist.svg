<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="Abstract graphic of connected nodes, used in place of a portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16243D"/>
      <stop offset="1" stop-color="#0A1222"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#3D6BFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#3D6BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#8DA8FF" fill-opacity=".28"/>
    </pattern>
  </defs>
  <rect width="1200" height="1000" fill="url(#bg)"/>
  <rect width="1200" height="1000" fill="url(#dots)"/>
  <rect width="1200" height="1000" fill="url(#glow)"/>
  <!-- concentric layers: information passing through successive checks -->
  <g fill="none" stroke="#8DA8FF" stroke-opacity=".3" stroke-width="2">
    <circle cx="600" cy="480" r="120"/>
    <circle cx="600" cy="480" r="220"/>
    <circle cx="600" cy="480" r="320"/>
  </g>
  <!-- links -->
  <g stroke="#8DA8FF" stroke-opacity=".6" stroke-width="3" stroke-linecap="round">
    <path d="M600 480L492 370"/><path d="M600 480L706 392"/><path d="M600 480L520 600"/><path d="M600 480L728 588"/>
    <path d="M492 370L380 300"/><path d="M492 370L430 250"/><path d="M706 392L830 340"/><path d="M706 392L760 260"/>
    <path d="M520 600L400 690"/><path d="M728 588L850 664"/><path d="M728 588L742 730"/>
  </g>
  <!-- nodes -->
  <g fill="#0A1222" stroke="#8DA8FF" stroke-width="4">
    <circle cx="492" cy="370" r="15"/><circle cx="706" cy="392" r="15"/><circle cx="520" cy="600" r="15"/><circle cx="728" cy="588" r="15"/>
    <circle cx="380" cy="300" r="11"/><circle cx="430" cy="250" r="11"/><circle cx="830" cy="340" r="11"/><circle cx="760" cy="260" r="11"/>
    <circle cx="400" cy="690" r="11"/><circle cx="850" cy="664" r="11"/><circle cx="742" cy="730" r="11"/>
  </g>
  <!-- the centre: the point where a person checks and decides -->
  <circle cx="600" cy="480" r="44" fill="#0A1222" stroke="#3DDCC8" stroke-width="7"/>
  <circle cx="600" cy="480" r="15" fill="#3DDCC8"/>
  <circle cx="600" cy="480" r="66" fill="none" stroke="#3DDCC8" stroke-opacity=".35" stroke-width="2"/>
</svg>
