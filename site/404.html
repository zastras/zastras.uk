<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Zastras Practical AI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1222">
  <!-- This page is served for any missing address, at any depth, so relative paths cannot be trusted.
       The script sets a base: the live site is at the domain root; the GitHub Pages preview lives under /zastras.uk/. -->
  <script>document.write('<base href="' + (location.pathname.indexOf("/zastras.uk/") === 0 ? "/zastras.uk/" : "/") + '">');</script>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <main id="main" class="section section--dark texture on-dark" style="min-height:100vh;display:grid;align-items:center">
    <div class="container" style="display:grid;gap:1.4rem;justify-items:start">
      <a class="brand" href="./" aria-label="Zastras Practical AI, home page">
        <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="15" fill="#13203A"/>
          <path d="M17 19H47L17 45H47" fill="none" stroke="#DCE6FF" stroke-width="5" stroke-linejoin="miter"/>
          <circle cx="17" cy="19" r="4.8" fill="#8DA8FF"/>
          <circle cx="47" cy="45" r="6" fill="#0A1222" stroke="#3DDCC8" stroke-width="3.2"/>
        </svg>
        <span class="brand__text">
          <span class="brand__name">Zastras</span>
          <span class="brand__sub">Practical AI</span>
        </span>
      </a>
      <p class="eyebrow">Error 404</p>
      <h1>That page does not exist.</h1>
      <p class="lead">The address may have been mistyped, or the page may have moved. The home page has everything we offer.</p>
      <a class="btn btn--primary" href="./">Back to the home page</a>
    </div>
  </main>
</body>
</html>
